[project]
name = "app"
version = "0.1.0"
description = ""
authors = [{ name = "Admin", email = "admin@example.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "uvicorn (>=0.54.0,<0.55.0)",
    "fastapi (>=0.162.0,<0.163.0)",
    "python-multipart (>=0.0.33,<0.0.34)",
    "email-validator (>=2.3.0,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "celery (>=5.7.0,<6.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    # Newest bcrypt passlib 1.7 works with: 4.1 drops bcrypt.__about__, which
    # passlib reads, and 5.0 rejects the >72-byte probe passlib runs at startup.
    "bcrypt (==4.0.1)",
    "tenacity (>=9.2.1,<10.0.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "emails (>=1.1.3,<2.0.0)",
    "sentry-sdk (>=2.74.0,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
mypy = "^2.4.1"
black = "^26.10.1"
isort = "^9.0.2"
autoflake = "^2.4.0"
flake8 = "^7.5.0"
pytest-cov = "^7.1.0"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
